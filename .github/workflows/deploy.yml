name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/devops-project:latest
            ${{ secrets.DOCKER_USERNAME }}/devops-project:${{ github.sha }}

      - name: Dry-run Helm Render
        run: |
          helm template my-app ./my-app --set image.repository=${{ secrets.DOCKER_USERNAME }}/devops-project --set image.tag=${{ github.sha }}